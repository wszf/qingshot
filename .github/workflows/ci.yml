name: macOS CI and Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve package version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=0.3.0
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must use vMAJOR.MINOR.PATCH' >&2
              exit 1
            fi
            version="${REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Import QingShot self-signed signing identity
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          QINGSHOT_SIGNING_P12_BASE64: ${{ secrets.QINGSHOT_SIGNING_P12_BASE64 }}
          QINGSHOT_SIGNING_P12_PASSWORD: ${{ secrets.QINGSHOT_SIGNING_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/qingshot-signing.keychain-db"
          P12="$RUNNER_TEMP/qingshot-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "QINGSHOT_TEMP_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "QINGSHOT_TEMP_P12=$P12" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$QINGSHOT_SIGNING_P12_BASE64" | base64 -D > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$QINGSHOT_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if ! security find-certificate -c "QingShot Self-Signed" "$KEYCHAIN" >/dev/null 2>&1; then
            echo "QingShot Self-Signed certificate was not imported" >&2
            exit 1
          fi
          echo "QINGSHOT_SIGNING_IDENTITY=QingShot Self-Signed" >> "$GITHUB_ENV"
          echo "Signing identity: QingShot Self-Signed"
      - name: Build, test and package Apple Silicon app
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/release.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/appcast.sh "$VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: QingShot-macOS-arm64
          path: .build/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${QINGSHOT_TEMP_KEYCHAIN:-}" ]]; then
            security delete-keychain "$QINGSHOT_TEMP_KEYCHAIN" || true
          fi
          if [[ -n "${QINGSHOT_TEMP_P12:-}" ]]; then
            rm -f "$QINGSHOT_TEMP_P12"
          fi
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: QingShot-macOS-arm64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
          Apple Silicon (arm64) only. Requires macOS 15 or later.

          Signed with QingShot Self-Signed for consistent updates. This build is not Apple-notarized. macOS may block its first launch; review it in System Settings → Privacy & Security.

          仅支持 Apple Silicon，要求 macOS 15 或更新版本。使用 QingShot Self-Signed 证书签名以保持更新一致性，但未经 Apple 公证。首次启动可能被系统拦截，可在「系统设置 → 隐私与安全性」中查看。
          NOTES
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "QingShot $RELEASE_TAG" \
            --notes-file notes.md --generate-notes
